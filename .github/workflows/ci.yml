name: CI

on:
  push:
    branches: [main, master]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  # Headless kernel / IO / CLI tests — run everywhere, no GPU needed.
  test:
    name: Test (default features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # GUI build — validates the wgpu / winit / egui viewer compiles & links
  # against the real crates.io toolchain + system display libraries.
  gui:
    name: Build GUI (--features gui)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev

      - name: Build viewer (compile + link only)
        run: |
          set -o pipefail
          cargo build -p tdmodeler-app --features gui 2>&1 | tee gui-build.log

      # On failure, publish the raw build log into a PUBLIC issue (via the
      # workflow's own GITHUB_TOKEN). Issues on a public repo are readable
      # through the GitHub API without authentication, so the log can be
      # fetched and inspected without manual copy/paste.
      - name: Publish build log on failure
        if: failure()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RUN_ID: ${{ github.run_id }}
        run: |
          python3 - <<'PY'
          import os, json, urllib.request, urllib.error
          token = os.environ['GITHUB_TOKEN']
          run_id = os.environ['RUN_ID']
          try:
              with open('gui-build.log','r',errors='replace') as f:
                  body = f.read()[-50000:]
          except Exception as e:
              body = "no log: %s" % e
          data = json.dumps({
              "title": "CI GUI build log (run %s)" % run_id,
              "body": "```\n" + body + "\n```"
          }).encode()
          req = urllib.request.Request(
              "https://api.github.com/repos/124476115/3dwon/issues",
              data=data,
              headers={"Authorization":"Bearer "+token,
                       "Accept":"application/vnd.github+json",
                       "User-Agent":"ci"},
              method="POST")
          try:
              with urllib.request.urlopen(req) as r:
                  print("issue created:", r.status)
          except urllib.error.HTTPError as e:
              print("issue create failed:", e.code, e.read().decode()[:500])
          PY
