name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: write
  issues: write

env:
  CARGO_TERM_COLOR: always

jobs:
  # Headless kernel / IO / CLI tests — run everywhere, no GPU needed.
  test:
    name: Test (default features)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - name: Build
        run: cargo build --workspace
      - name: Test
        run: cargo test --workspace

  # GUI build — validates the wgpu / winit / egui viewer compiles & links
  # against the real crates.io toolchain + system display libraries.
  gui:
    name: Build GUI (--features gui)
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2

      - name: Install Linux system libraries
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libx11-dev libxkbcommon-dev libwayland-dev \
            libxrandr-dev libxinerama-dev libxcursor-dev libxcomposite-dev \
            libegl1-mesa-dev libgl1-mesa-dev libvulkan-dev

      - name: Build viewer (compile + link only)
        run: |
          set -o pipefail
          cargo build -p tdmodeler-app --features gui 2>&1 | tee gui-build.log

      # Always publish the raw build log to a public per-OS branch
      # (via the workflow's own GITHUB_TOKEN, granted contents:write above).
      # It is then retrievable with `git fetch` (git protocol, not subject to
      # the GitHub REST rate limit) and inspected without manual copy/paste.
      - name: Publish build log
        if: always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "ci-bot"
          git config user.email "ci@github.com"
          mkdir -p ci-logs
          echo "OUTCOME=${{ job.status }}" > "ci-logs/gui-build-${{ matrix.os }}.log"
          echo "COMMIT=${{ github.sha }}" >> "ci-logs/gui-build-${{ matrix.os }}.log"
          cat gui-build.log >> "ci-logs/gui-build-${{ matrix.os }}.log"
          git add ci-logs
          git commit -m "ci: gui build log (${{ matrix.os }})" || true
          git push --force https://x-access-token:${GITHUB_TOKEN}@github.com/124476115/3dwon.git HEAD:ci-logs-${{ matrix.os }} || true
